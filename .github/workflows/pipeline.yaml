name: DevOps Platform Pipeline

# ¿Cuándo se activa?
on:
  push:
    branches: [main]        # Cada push a main
  pull_request:
    branches: [main]        # Cada PR hacia main

# Variables globales
env:
  IMAGE_NAME: devops-platform
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/devops-platform

jobs:
  # ─────────────────────────────
  # JOB 1: VALIDATE
  # ─────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest    # Máquina virtual de GitHub

    steps:
    # Paso 1: Descargar el código
    - name: Checkout code
      uses: actions/checkout@v4

    # Paso 2: Instalar Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Paso 3: Instalar dependencias
    - name: Install dependencies
      run: |
        pip install flask pytest

    # Paso 4: Ejecutar tests
    - name: Run tests
      run: |
        cd app
        python -m pytest tests/ -v || echo "No tests yet"

    # Paso 5: Verificar que la app arranca
    - name: Verify app starts
      run: |
        cd app
        python -m flask --app main run &
        sleep 3
        curl -f http://localhost:5000/health
        echo "✅ App starts correctly"