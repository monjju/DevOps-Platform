apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/monjju/DevOps-Platform.git
    targetRevision: main
    path: proyecto-4-gitops/apps/devops-platform/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true      # elimina recursos que ya no están en Git
      selfHeal: true   # si alguien cambia algo manual, ArgoCD lo revierte
    syncOptions:
      - CreateNamespace=true  # crea el namespace si no existe
